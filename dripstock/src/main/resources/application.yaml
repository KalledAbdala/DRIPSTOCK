spring:
  application:
    name: dripstock

  datasource:
    url: jdbc:postgresql://localhost:5432/dripstock
    username: dripstock_user
    password: dripstock123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080